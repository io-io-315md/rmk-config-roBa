[package]
name = "roba-mouse-navigation-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmk = { version = "=0.9.0", default-features = false, features = ["std"] }
rmk-config = "=0.8.0"
critical-section = { version = "1.2", features = ["std"] }
serde_json = "1"
# Match Serde's std mode in the host test's HID serializer.
ssmarshal = { version = "1.0", features = ["std"] }

[lib]
path = "behavior.rs"
